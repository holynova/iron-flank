<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">铁甲夹击 Iron Flank — 二打一回合制坦克战棋</title>
  <desc id="desc">深蓝底卡通像素风标题：铁甲夹击，副标题两辆夹一辆，集火定胜负；右侧是 8×8 棋盘局部，两辆蓝坦克夹住一辆红坦克，红坦克被集火击毁。</desc>

  <rect width="1200" height="360" rx="26" fill="#171d2b"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#8fa3c8">回合制坦克战棋 · TURN-BASED TANK TACTICS</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f5c518">铁甲夹击</text>
    <text x="56" y="168" font-size="23" fill="#e8ecf4">IRON FLANK — 两辆夹一辆，集火定胜负</text>
    <text x="56" y="204" font-size="19" fill="#aab6cc">8×8 棋盘，红蓝各 6 辆坦克，移动、集火、技能。</text>
    <g id="chips" font-size="18" fill="#e8ecf4" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#232c3f" stroke="#3a4763" stroke-width="1.5"/><text x="119" y="262">10 张地图</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#232c3f" stroke="#3a4763" stroke-width="1.5"/><text x="257" y="262">8 关战役</text></g>
      <g><rect x="332" y="238" width="150" height="36" rx="18" fill="#232c3f" stroke="#3a4763" stroke-width="1.5"/><text x="407" y="262">人机 / 双人</text></g>
      <g><rect x="494" y="238" width="162" height="36" rx="18" fill="#232c3f" stroke="#3a4763" stroke-width="1.5"/><text x="575" y="262">46 个测试全过</text></g>
    </g>
  </g>

  <g id="board-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="820" y="40" font-size="18" fill="#8fa3c8">二打一集火 · [蓝][蓝][红] → 击毁</text>
    <g id="grid" stroke="#1e2b18" stroke-width="2">
      <rect x="820" y="56" width="60" height="60" fill="#79c14f"/>
      <rect x="880" y="56" width="60" height="60" fill="#6ab844"/>
      <rect x="940" y="56" width="60" height="60" fill="#79c14f"/>
      <rect x="1000" y="56" width="60" height="60" fill="#6ab844"/>
      <rect x="1060" y="56" width="60" height="60" fill="#79c14f"/>
      <rect x="820" y="116" width="60" height="60" fill="#6ab844"/>
      <rect x="880" y="116" width="60" height="60" fill="#79c14f"/>
      <rect x="940" y="116" width="60" height="60" fill="#6ab844"/>
      <rect x="1000" y="116" width="60" height="60" fill="#79c14f"/>
      <rect x="1060" y="116" width="60" height="60" fill="#6ab844"/>
      <rect x="820" y="176" width="60" height="60" fill="#79c14f"/>
      <rect x="880" y="176" width="60" height="60" fill="#6ab844"/>
      <rect x="940" y="176" width="60" height="60" fill="#79c14f"/>
      <rect x="1000" y="176" width="60" height="60" fill="#6ab844"/>
      <rect x="1060" y="176" width="60" height="60" fill="#79c14f"/>
      <rect x="820" y="236" width="60" height="60" fill="#6ab844"/>
      <rect x="880" y="236" width="60" height="60" fill="#79c14f"/>
      <rect x="940" y="236" width="60" height="60" fill="#6ab844"/>
      <rect x="1000" y="236" width="60" height="60" fill="#79c14f"/>
      <rect x="1060" y="236" width="60" height="60" fill="#6ab844"/>
    </g>
    <g id="trees">
      <g transform="translate(910 86)"><circle r="15" fill="#2e7d32"/><circle cx="9" cy="-7" r="9" fill="#43a047"/></g>
      <g transform="translate(1030 266)"><circle r="15" fill="#2e7d32"/><circle cx="9" cy="-7" r="9" fill="#43a047"/></g>
    </g>
    <g id="tank-blue-1" transform="translate(910 146)">
      <rect x="-19" y="-13" width="38" height="26" rx="6" fill="#4a90d9" stroke="#16202e" stroke-width="2"/>
      <rect x="10" y="-3" width="18" height="6" rx="2" fill="#16202e"/>
      <circle cx="0" cy="0" r="9" fill="#3570ad" stroke="#16202e" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#16202e"/>
    </g>
    <g id="tank-blue-2" transform="translate(970 146)">
      <rect x="-19" y="-13" width="38" height="26" rx="6" fill="#4a90d9" stroke="#16202e" stroke-width="2"/>
      <rect x="10" y="-3" width="18" height="6" rx="2" fill="#16202e"/>
      <circle cx="0" cy="0" r="9" fill="#3570ad" stroke="#16202e" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#16202e"/>
    </g>
    <g id="tank-red" transform="translate(1030 146)">
      <rect x="-19" y="-13" width="38" height="26" rx="6" fill="#e5484d" stroke="#16202e" stroke-width="2"/>
      <rect x="10" y="-3" width="18" height="6" rx="2" fill="#16202e"/>
      <circle cx="0" cy="0" r="9" fill="#b32f33" stroke="#16202e" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#16202e"/>
    </g>
    <polygon id="hit-burst" fill="#f5c518" stroke="#e5484d" stroke-width="2" opacity="0.95"
      points="1056,146 1040.2,150.2 1048.4,164.4 1034.2,156.2 1030,172 1025.8,156.2 1011.6,164.4 1019.8,150.2 1004,146 1019.8,141.8 1011.6,127.6 1025.8,135.8 1030,120 1034.2,135.8 1048.4,127.6 1040.2,141.8"/>
  </g>
</svg>
